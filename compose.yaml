services:
  postgres:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_DB: task_manager_test
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: task_manager_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager_test -d task_manager_test"]
      interval: 2s
      timeout: 3s
      retries: 20
